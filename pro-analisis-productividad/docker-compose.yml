services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arku_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
    env_file:
      - .env
    networks:
      - arku_network

  web:
    image: nginx:alpine
    container_name: arku_web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - arku_network

  db:
    image: mysql:8.0
    container_name: arku_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-arku_db}
      MYSQL_USER: ${DB_USERNAME:-arku_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret123}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret123}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - arku_network

networks:
  arku_network:
    driver: bridge

volumes:
  db_data:
    driver: local

